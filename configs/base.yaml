# =============================================================================
# BASE PROTOCOL -- FIXED across all runs
# =============================================================================
# This file will be FROZEN in Phase 5 together with PROTOCOL.md.
# Every number here is a decision; if you change one, write it into decisions.md
# with its rationale and RE-RUN the affected runs. A tweak made after seeing the
# results reads as "cherry-picking".
#
# Important limitation (to be written in the paper): the model is fixed across
# all configurations. The findings are about the DATA, not about the model.
# =============================================================================

model:
  # YOLO26 nano. NMS-free, small-object oriented label assignment (STAL).
  # Note: if the ultralytics version does not know YOLO26, fall back to
  # yolo11n.pt and write this into decisions.md -- do not change it silently.
  weights: yolo26n.pt
  task: detect

data:
  root: data/processed          # convert.py output
  splits_dir: splits            # stem lists committed to git
  nc: 5
  names: [S.aureus, B.subtilis, P.aeruginosa, E.coli, C.albicans]
  # ^ The ORDER has to be the SAME as in convert.py. If it changes, all labels break.

train:
  # --- IMAGE SIZE: the single most critical hyperparameter of the project -----
  # The AGAR lower-resolution images are 2048x2048.
  # Colony sizes measured from the demo package (in original pixels):
  #     C.albicans  median 27.5 px   (min 14)
  #     S.aureus    median 29.0 px   (min 24)
  #     E.coli      median 128 px
  # imgsz=640  -> C.albicans 8.6 px  ... the stride of the P5 head is 8, detection is close to impossible
  # imgsz=1024 -> 13.8 px
  # imgsz=1280 -> 17.2 px            <- the chosen one
  # imgsz=1536 -> 20.6 px
  # The AGAR paper also got its best result at low resolution by staying close
  # to the full size (mAP 59.4%). If you pick 640, the baseline stays below
  # AGAR's and the gate of Phase 2 answers NO to the question "is the baseline
  # reasonable".
  # The cost: VRAM and time ~ imgsz^2. 1280 is ~4x of 640.
  # Decision: start with 1280. If VRAM is not enough, lower the batch, do NOT
  # lower the imgsz.
  imgsz: 1280

  epochs: 150
  patience: 50               # early stopping; will be logged for the time measurement
  # MEASURED on the full data, RTX 4060 Laptop 8 GB (decision 3.75):
  #   batch 8 -> peak VRAM 7.209 / 7.62 GB, and the caching allocator already
  #              logged an OOM at 45% of a SINGLE epoch. 374 iter @ 2.5 it/s = 150 s
  #   batch 4 -> peak VRAM 3.916 GB, no OOM.        747 iter @ 5.3 it/s = 141 s
  # batch 4 is both safer AND faster: at batch 8 the allocator thrashes.
  # nbs=64 keeps the effective optimisation batch identical, so the science
  # is unchanged. The SAME value must be used for all 61 runs.
  batch: 4                   # overridden per VRAM via scripts/train.py --batch
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  deterministic: true
  # SYSTEM RAM, not VRAM (decision 3.75). Each worker decodes a full 2048x2048
  # plate before resizing; on the 16 GB machine 8 workers exhausted RAM and the
  # OOM killer took down the desktop session (25 Aug). 2 measured stable.
  # Keep FIXED across all runs: it does not change the result, but it does change
  # the TIME measurement that feeds budget.py.
  workers: 2
  amp: true                  # mixed precision; the time measurement is done with this
  val: true
  plots: false               # unnecessary I/O in the grid
  save_period: -1

  # --- For small objects -----------------------------------------------------
  # This is a counting task: there are up to 125 colonies on a plate, the
  # default of 300 is enough, but it was raised as insurance against clipping on
  # crowded plates.
  max_det: 1000
  nms_iou: 0.7               # ignored if YOLO26 runs NMS-free

# =============================================================================
# AUGMENTATION POLICY -- the critical decision of Phase 2
# =============================================================================
# The problem: Ultralytics ships with mosaic=1.0 by default (and in some
# versions mixup/copy_paste may be non-zero). If you do nothing, your G50/G25/G10
# control groups ALREADY use classic data augmentation -> the "diffusion vs
# classic" comparison is blurred from the start. The gain of diffusion cannot be
# separated from the gain of mosaic.
#
# Decision: minimum augmentation IN THE MAIN GRID. Only label-preserving
# transforms that suit the physics of a plate:
#   - fliplr / flipud: an agar plate has NO canonical orientation, both are legitimate
#   - hsv: illumination and growth-medium colour variability is a real source of variance
# The ones that are off, and why:
#   - mosaic: it merges 4 plates into a single frame; it breaks the scale,
#     destroys the plate boundary, and pushes the colony density distribution
#     away from reality. Especially harmful for a counting task.
#   - mixup: the transparent superposition of two plates is microbiologically meaningless
#   - copy_paste: this is exactly the arm of Baseline C. If it is on in the main
#     grid, the "diffusion vs copy-paste" comparison becomes undefined.
#   - scale/translate/shear/perspective: colony size is a CLASS cue
#     (S.aureus small, E.coli large). Randomly perturbing the scale corrupts the
#     class signal. There is also the risk of breaking the box-colony alignment.
#   - erasing: a classification augmentation, unnecessary in detection
#
# This policy is NOT THE SAME as Baseline A: Baseline A is "no augmentation".
# Here there is flip + HSV. The phrase in the roadmap, "Baseline A = the same as
# the G50/G25/G10 in the main grid", refers to this policy.
# For Baseline B and C: configs/aug_b_classic.yaml, configs/aug_c_copypaste.yaml
# =============================================================================
augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  fliplr: 0.5
  flipud: 0.5

  degrees: 0.0
  translate: 0.0
  scale: 0.0
  shear: 0.0
  perspective: 0.0
  mosaic: 0.0
  close_mosaic: 0             # mosaic is off anyway
  mixup: 0.0
  cutmix: 0.0                 # added in ultralytics 8.4
  copy_paste: 0.0
  erasing: 0.0
  auto_augment: null
  bgr: 0.0

# =============================================================================
eval:
  # The primary metric. It is the first column in the tables.
  primary_metric: mAP50-95
  # The "there is a difference" threshold -- the same threshold will be used in
  # the Phase 4 pilot and in the main grid. It must be LARGER than the standard
  # deviation across seeds; it will be measured and fixed here after the Phase 2
  # baseline is finished.
  significant_diff_threshold: null    # <- fill in once G100 x 3 seeds is measured
  # The counting conf threshold is chosen on VAL, written here, and applied to
  # the test that way.
  conf_thr: null              # <- will come from the val run
  iou_thrs: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  area_ranges: coco           # 32^2 / 96^2, on the original 2048px image

  # Advisor (13 Aug 2026): "Raising the number of seeds to 5 will be enough. It
  # would be good if you showed their maximum, minimum and mean in the plots
  # relating to the corresponding scores."
  reporting:
    plot: [min, max, mean]      # error bar = min-max range
    table: [mean, std]          # std will also be reported (defensible with n=5)

seeds:
  main_grid: [0, 1, 2, 3, 4]  # 5 seeds -- approved by the advisor
  side_arms: [0, 1, 2]        # 3 seeds -- classic arm, ablation, amount sweep

# =============================================================================
# XAI arm -- approved by the advisor (optional section, AFTER the ablation)
# "You can provide activation maps with Grad-CAM/++. You can also give scores
#  such as IoU and ELR for the real and synthetic data ratios."
# No training: inference only, with the existing weights. The cost is negligible.
# =============================================================================
xai:
  enabled: true
  methods: [gradcam, gradcampp]
  # The models to be compared: real-supported vs synthetic-supported
  configs: [G100, G25, G25+S, S100]
  seed: 0                     # a single seed is enough, this is not a quantitative main finding
  n_images: 200               # from the test set, a class-balanced sample
  metrics:
    - IoU                     # thresholded mask of the heat map vs the GT box
    - EBPG                    # Energy-Based Pointing Game (the energy share inside the box)
  # NOTE: the "ELR" the advisor wrote could not be verified as a standard XAI
  # metric. Its most likely counterpart is EBPG (Energy-Based Pointing Game) --
  # in the CAM literature this is the measure reported together with IoU. TO BE
  # CONFIRMED; until confirmation arrives it will be implemented as EBPG and
  # written under that name in the paper.

logging:
  wandb: true
  project: agar-synth
  # Section 6 (computational cost) will be written from these fields -- FROM THE
  # FIRST run onwards
  measured_fields: [total_sec, sec_per_epoch, gpu_hours, peak_vram_gb,
                    ms_per_image, param_count, gflops]
