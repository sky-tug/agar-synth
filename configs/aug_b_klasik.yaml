# Baseline B -- KLASIK GEOMETRIK + RENK DONUSUMLERI
#
# base.yaml'in uzerine biner (train.py --config base.yaml --overlay aug_b_klasik.yaml)
# Sadece augment blogu degisir. Model, imgsz, epoch, seed -- hepsi ayni.
#
# Amac: "difuzyon pahali bir islem; ucuz klasik donusumler ayni kazanci
# veriyorsa difuzyonun pratik gerekcesi kalmaz" sorusunun ilk kolu.
#
# Buradaki degerler Ultralytics'in tespit varsayilanlarina yakin tutuldu ki
# "kotu ayarlanmis baseline" elestirisi gelmesin.

augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  fliplr: 0.5
  flipud: 0.5

  # 🔴 degrees 180.0 -> 0.0  (17 Agu 2026, karar 3.32)
  # Plagin kanonik yonu gercekten yok, yani DONDURME MESRU. Sorun etikette:
  # Ultralytics dondurmede kutunun dort kosesini dondurup EKSENE HIZALI yeni bir
  # kutu ciziyor (RandomPerspective.apply_bboxes -> kose min/max). Kare bir kutu
  # 45 derecede kenari sqrt(2) katina cikiyor, alani iki katina.
  # AGAR kolonileri YUVARLAK ve kutularin %96.9'u KARE: yuvarlak bir nesne
  # dondurulunce dogru kutu HIC DEGISMEZ. Yani her acili dondurme bilgi katmiyor,
  # etiketi bozuyor. Baseline B sisirilmis kutularla egitilip dogru kutulu testte
  # olculurse mAP'i haksiz duser -> difuzyon lehine SAHTE kazanc.
  # Baseline C'nin copy_paste riskinin aynadaki hali.
  # fliplr + flipud zaten dihedral grubun 4 elemanini veriyor ve kutuyu HIC bozmuyor.
  degrees: 0.0
  translate: 0.1
  scale: 0.5            # DIKKAT: koloni boyutu sinif ipucu; bu kol o ipucunu
                        # bilerek bozuyor. Bulgu buna gore yorumlanacak.
  shear: 0.0
  perspective: 0.0

  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  erasing: 0.0
  auto_augment: null
  bgr: 0.0
