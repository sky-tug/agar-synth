# Baseline C -- COPY-PASTE / MOSAIC / MIXUP
#
# base.yaml'in uzerine biner.
# Bu, difuzyonun ASIL rakibi. Yol haritasi Faz 4: copy-paste kolu pilotta
# difuzyonla ayni anda kosuyor, cunku ucuz ve sonucu makalenin hikayesini
# belirliyor.
#
# UYARI -- Ultralytics'in copy_paste'i segmentasyon maskesi ister.
# Detect gorevinde copy_paste sessizce etkisiz kalabilir. Iki secenek:
#   (a) surumu kontrol et; detect'te calismiyor ise
#   (b) src/generate/kopyala_yapistir.py ile OFFLINE copy-paste uret
#       (koloni kirpiplarini gercek plaklara yapistir, kutuyu birlikte tasi)
# Hangisi kullanildiysa decisions.md'ye yaz. Sessizce etkisiz bir baseline,
# difuzyon lehine sahte bir kazanc uretir -- en tehlikeli hata bu.

augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  fliplr: 0.5
  flipud: 0.5

  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0

  mosaic: 1.0
  close_mosaic: 10      # son 10 epoch mosaic kapali -- Ultralytics onerisi
  mixup: 0.15
  copy_paste: 0.3
  copy_paste_mode: flip
  erasing: 0.0
  auto_augment: null
  bgr: 0.0

# Offline copy-paste kullanilacaksa:
offline_copy_paste:
  aktif: false
  hedef_koloni_carpani: 1.5     # goruntu basina koloni sayisini ~1.5x'e cikar
  kaynak: train                 # SADECE o seviyenin train kumesinden kirp
                                # (val/test'ten kirpmak sizinti olur)
